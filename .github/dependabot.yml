# Weekly version updates. Security updates are enabled in the repo settings and still open
# straight away, one PR per advisory, outside these groups.
version: 2
updates:
  - package-ecosystem: npm
    # The pnpm workspace: the root plus every package and app manifest.
    directories: ["/", "/packages/*", "/apps/*"]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    # Published packages: when a version already fits the range, update only the lockfile. Raising
    # a range's floor is a requirement change for consumers; for a peer range (db-supabase's
    # @supabase/supabase-js, #229) it forces every app to upgrade.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Next and React move together; keep them in one PR.
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
      # A major still gets a PR of its own, since each needs its own migration, but one PR for
      # every directory instead of one per package (vitest 5 came as 11 PRs without this).
      majors:
        patterns: ["*"]
        update-types: [major]
        group-by: dependency-name
    # Workspace packages are versioned by Changesets, not Dependabot.
    ignore:
      - dependency-name: "@azmr/*"
      # isolated-vm 7 requires Node 24; @azmr/ai supports Node 22 (LTS until April 2027). As an
      # optional dependency it would fail to install there and @azmr/ai would quietly fall back
      # to its weaker sandbox (#231). Lift this when @azmr/ai drops Node 22.
      - dependency-name: isolated-vm
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Pacific/Auckland
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # changesets/action v2 requires Changesets CLI v3 (we are on v2) and renames the inputs
      # release.yml uses. Only the release workflow runs it, on main, so CI on a Dependabot PR
      # cannot catch the break. Lift this when the Changesets v3 migration lands.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
