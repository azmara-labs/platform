name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is required - without it the skill only prints its
          # findings to the run log and explicitly declines to post
          # anything ("Since this command was invoked without --comment,
          # I'll stop after reporting findings to the terminal"). Root-caused
          # across three debug runs with show_full_output: first the Skill
          # tool itself was denied (needed --allowedTools Skill, below);
          # once that was fixed, the skill ran cleanly, found real issues,
          # and still posted nothing - because --comment was never passed.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools Skill'
          # TEMPORARY debug flag (round 3) - --comment landed but a 36-turn
          # run still posted nothing, with no error. Hypothesis:
          # --allowedTools Skill lets the skill START but whatever tool it
          # calls internally to actually post a comment (likely a specific
          # mcp__ tool, not Skill itself) may also need allowlisting - the
          # same class of problem as the original Skill denial, one layer
          # deeper. Full output should show the exact tool name near the
          # end of the transcript. Revert once root-caused.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

