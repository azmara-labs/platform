name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is required - without it the skill only prints its
          # findings to the run log and declines to post anything.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Three layers, each root-caused with show_full_output across
          # separate debug runs:
          #  1. Skill - the code-review skill itself is invoked via the
          #     Skill tool, denied by default.
          #  2. Bash(gh api:*) - the skill's actual comment-posting call is
          #     a raw `gh api repos/.../pulls/.../comments` shell command,
          #     not part of the Skill tool at all - a completely separate
          #     denial once (1) was fixed. Confirmed directly in a run's own
          #     output: "I attempted to post this as an inline comment via
          #     `gh api repos/.../pulls/68/comments`, but the command was
          #     blocked ('This command requires approval')."
          #  3. Bash(gh pr comment:*) - the fallback route the skill itself
          #     suggested trying if the inline-comment API call didn't work.
          #  Quoting bug found via show_full_output: the unquoted comma list
          #  above got split on spaces too, shredding "Bash(gh api:*)" and
          #  "Bash(gh pr comment:*)" into meaningless fragments
          #  (["Skill","Bash(gh","api:*)","pr","comment:*)"] - none of which
          #  are valid patterns). Wrapping the whole list in double quotes so
          #  it survives as one token with internal spaces intact.
          claude_args: '--allowedTools "Skill,Bash(gh api:*),Bash(gh pr comment:*)"'
          # TEMPORARY debug flag - verifying the allowedTools array parses
          # correctly this time before removing. Revert once confirmed.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

