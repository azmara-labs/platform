name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Dependabot's own pushes get the breaking-change review in dependency-review.yml instead
    # (they cannot read this secret). A person's fix commit on a Dependabot PR is reviewed here.
    if: github.actor != 'dependabot[bot]'
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The review's shell access is limited to `gh pr comment`. On a large diff the model
      # otherwise tries to pipe or redirect `gh pr diff` to filter it, those calls are denied,
      # and the review can end without a comment. Hand it the diff as a file to Read and Grep.
      - name: Save the PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR" > pr.diff

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Release workflow opens the "Version Packages" PR as the
          # azmara-cla-bot GitHub App (the PR author) and refreshes its branch
          # with commits authored by github-actions[bot] (the actor on later
          # pushes). Without the allowlist the action refuses to run for a
          # non-human actor and the check fails. Named bots only, not '*'.
          allowed_bots: "azmara-cla-bot,github-actions"
          # Custom prompt instead of the packaged code-review plugin. The
          # plugin's own skill spawns background sub-agents and waits for
          # async completion notifications, which never arrive in a
          # single-shot, non-interactive `claude -p` CI invocation - the
          # process exits once the assistant produces a plain-text turn
          # with no more tool calls, discarding whatever the backgrounded
          # work would have produced. This prompt does the same job
          # (fetch diff, review, post one comment) entirely synchronously,
          # explicitly forbidding backgrounding.
          prompt: |
            You are reviewing pull request ${{ github.repository }}#${{ github.event.pull_request.number }} ("${{ github.event.pull_request.title }}").

            IMPORTANT: This is a single-shot, non-interactive session with no
            live process to deliver async notifications back into. Do NOT use
            the Task/Agent tool or spawn any background/subagent work -
            anything backgrounded will silently never finish and its result
            will be lost. Do everything directly, synchronously, in your own
            turns.

            Steps:
            1. The full diff of this PR is already saved in `pr.diff` in the working directory. Read it with the Read tool (use offset and limit for a large file) and search it with Grep. Do not run `gh pr diff`, and do not pipe, redirect or chain shell commands (`|`, `>`, `;`, `&&`, `cat`, `sed`, `awk`): the only shell command allowed is `gh pr comment`, and anything else is rejected, which wastes turns.
            2. If a file's surrounding context would help you judge whether something is a real bug (not just the diff hunk in isolation), use Read/Grep/Glob to look at it directly.
            3. Review for genuine, confirmable issues: correctness bugs, security issues, resource leaks, broken error handling, obviously wrong logic. Do not flag style preferences, and do not invent hypothetical edge cases you cannot confirm from the code itself.
            4. Post exactly one review comment summarizing what you found. If you found genuine issues, list each as `**file:line** — description`. If you found nothing worth flagging, post a short comment saying so explicitly - do not skip posting.
            Post it with a quoted heredoc, exactly in this shape (END alone at the start of its line), so backticks, quotes and `$` in the text are safe:

            gh pr comment ${{ github.event.pull_request.number }} --body-file - <<'END'
            (comment text)
            END

            Do NOT use `--body "..."` with backticks inside the double quotes: that form is rejected by the tool permission check and the review is then lost.


            Keep the comment concise and specific - evidence-based findings, not hedged commentary.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh pr comment:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action reports success even when the review could not post (a tool call can be
      # denied and the run still ends green), so a PR could look reviewed when it was not.
      # If the run succeeded but claude[bot] left no comment since it started, say so on the PR.
      - name: Flag a review that posted nothing
        if: steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          posted=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$STARTED\") | .id" | wc -l)
          if [ "$posted" -eq 0 ]; then
            echo "::warning::claude-review finished without posting a comment"
            gh pr comment "$PR" --body "claude-review finished without posting a review, so this PR has not been reviewed by it. This is expected when the PR changes a workflow file (the action skips those). Otherwise re-run the check or close and reopen the PR."
          fi
