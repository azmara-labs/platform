name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is required - without it the skill only prints its
          # findings to the run log and declines to post anything.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Tool permissions, each root-caused with show_full_output across
          # separate debug runs (all confirmed working - the array parses
          # correctly and every allowed call succeeds with 0 permission
          # denials): Skill (the plugin itself), Bash(gh api:*) and
          # Bash(gh pr comment:*) (the two routes the skill uses to post).
          # The whole value must stay double-quoted, or the space inside
          # each Bash(...) pattern gets tokenized away along with the comma
          # separators, silently breaking both patterns.
          claude_args: '--allowedTools "Skill,Bash(gh api:*),Bash(gh pr comment:*)"'
          # KNOWN UNRESOLVED ISSUE (as of 2026-07-31): even with 0 permission
          # denials, no comment gets posted. The skill spawns background
          # sub-agents ("Summarize PR changes", "Find relevant CLAUDE.md
          # files") and waits for their async completion notifications -
          # but this is a single-shot, non-interactive `claude -p`
          # invocation, which exits once the assistant produces a plain-text
          # turn with no more tool calls ("Background agents are running;
          # I'll wait..."). There's no live session left to deliver those
          # notifications into. This looks like an architectural mismatch
          # between the code-review plugin (designed for an interactive,
          # persistent host) and one-shot CI execution, not a config
          # problem - likely needs either a flag to force synchronous/
          # non-backgrounded tool use, or a custom prompt that doesn't rely
          # on this packaged skill's own orchestration. Re-add
          # show_full_output: true to resume debugging.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

