name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Root-caused via show_full_output (two prior debug runs): the very
          # first tool call - Skill("code-review:code-review") - was denied
          # ("non_execution_kind": "user-rejected"), because the Skill tool
          # isn't in this action's default allowed-tools list. Everything
          # after that was Claude working around the denial by hand (Bash,
          # Agent, WebFetch...), which produced real findings via
          # ReportFindings but had no path to actually post them - the
          # code-review plugin's comment-posting only happens inside the
          # skill it was blocked from running.
          claude_args: '--allowedTools Skill'
          # TEMPORARY debug flag (round 2) - the Skill fix cut denials from
          # 35 to 12 (and cost $4.05 -> $2.59) but still posted nothing.
          # Something the skill itself calls internally also needs
          # allowlisting. Revert once root-caused.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

