name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Listed explicitly (the defaults omit ready_for_review) so closing and reopening a PR, or
    # taking it out of draft, re-runs every check.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Package standards (pr-quality-checks)
        run: node node_modules/@azmr/pr-quality-checks/scripts/run-all.mjs .

      - name: Build packages
        run: pnpm build

      - name: Size budgets (@azmr/ui)
        run: pnpm --filter @azmr/ui size

      - name: Consumer fixture (@azmr/ui packed into a fresh Next.js + Tailwind app)
        run: pnpm --filter @azmr/ui verify:consumer

      - name: Registry fixture (shadcn add @azmr/button into a standard shadcn app)
        run: pnpm --filter @azmr/ui verify:registry

      - name: Getting-started guides (Next.js, Vite, React Router and plain React, each built against the packed package)
        run: pnpm --filter @azmr/ui verify:guides

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Type check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Security audit
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm audit:deps

  docs-pages:
    name: Docs pages (axe in a real browser)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build the docs site
        run: pnpm turbo run build --filter=@azmr/site

      - name: Start the site
        run: |
          pnpm --filter @azmr/site start > site.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/sitemap.xml > /dev/null && exit 0
            sleep 2
          done
          cat site.log
          exit 1

      - name: Axe over every rendered page, light and dark (Chrome)
        run: |
          google-chrome --version
          pnpm --filter @azmr/site check:pages

  lighthouse:
    name: Lighthouse (mobile, medians of 3 runs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build the docs site
        run: pnpm turbo run build --filter=@azmr/site

      - name: Start the site
        run: |
          pnpm --filter @azmr/site start > site.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/sitemap.xml > /dev/null && exit 0
            sleep 2
          done
          cat site.log
          exit 1

      - name: Lighthouse against the budgets
        run: pnpm --filter @azmr/site check:lighthouse

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: apps/site/lighthouse-results.json
          if-no-files-found: ignore

  changeset:
    name: Changeset check
    runs-on: ubuntu-latest
    # Only check on PRs — not on direct pushes to main or the Changesets release branch
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changeset
        run: pnpm changeset status --since=origin/main
