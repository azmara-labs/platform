name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    # reopened and ready_for_review: the job skips drafts, so taking a PR out of draft needs its own
    # trigger, and a reopened PR should be checked again like a new one.
    types: [opened, closed, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    # The action locks a PR on every `closed` event (lock-pullrequest-aftermerge defaults to true)
    # without checking that it was merged. Closing and reopening an open PR, which is how a
    # bot-opened PR gets its checks, then locked it: on Version Packages PR #155 that left
    # claude-review and every comment unable to post. Run on `closed` only for a merge.
    if: >-
      (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target')
      && !github.event.pull_request.draft
      && !(github.event.action == 'closed' && !github.event.pull_request.merged)

    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CLA_BOT_APP_ID }}
          private-key: ${{ secrets.CLA_BOT_PRIVATE_KEY }}

      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/azmara-labs/platform/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: dependabot[bot],azmara-cla-bot[bot],coderchef26
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this, please sign our
            [Contributor License Agreement](https://github.com/azmara-labs/platform/blob/main/CLA.md).

            You only need to do this once. Comment below with:

            > I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: "Thank you for signing our CLA! ✅"
