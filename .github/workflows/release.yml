name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for npm OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # The newest 24.x, not the runner's cached one, so Node security releases
          # apply the day they ship (October 2026: cache was 24.21.0, fix is 24.22.1).
          check-latest: true
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Update npm for OIDC trusted publishing support
        run: npm install -g npm@latest # trusted publishing needs npm >=11.5.1

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CLA_BOT_APP_ID }}
          private-key: ${{ secrets.CLA_BOT_PRIVATE_KEY }}

      - name: Create release PR or publish
        # v2 is the version that understands Changesets CLI v3. With v1 the publish succeeded but
        # the action did not recognise it, so no git tag or GitHub release was pushed (0.14.0).
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # When changesets are present: opens a "Version Packages" PR
          # When that PR is merged: publishes to npm, pushes the git tags, creates the releases
          publish-script: pnpm changeset publish
          version-script: pnpm changeset version
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ steps.app-token.outputs.token }}
          # Push with the git CLI as v1 did, so commits and tags keep the same behaviour
          push-with-git-cli: true
        env:
          NPM_CONFIG_PROVENANCE: "true"
